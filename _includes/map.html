<!-- Home: a small Leaflet map of where Davide has studied and worked.
     Edit the `places` array below to add or change markers. -->
<h3>Where I've studied</h3>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<div id="home-map" style="height: 320px; border-radius: 14px; margin: 1rem 0 2rem; z-index: 0;"></div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
  (function () {
    var places = [
      { name: "Lethbridge, AB — University of Lethbridge", coords: [49.6781, -112.8606] },
      { name: "Padua, Italy — University of Padua", coords: [45.4064, 11.8768] },
      { name: "Messina, Italy — University of Messina", coords: [38.1907, 15.5520] }
    ];
    var map = L.map("home-map", { scrollWheelZoom: false });
    L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
      maxZoom: 19,
      attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>'
    }).addTo(map);
    var group = L.featureGroup(
      places.map(function (p) { return L.marker(p.coords).bindPopup(p.name); })
    ).addTo(map);
    map.fitBounds(group.getBounds().pad(0.3));
  })();
</script>
