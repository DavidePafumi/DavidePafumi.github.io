<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  {%- if page.title -%}
    {%- assign page_title = page.title | append: " · " | append: site.title -%}
  {%- else -%}
    {%- assign page_title = site.title -%}
  {%- endif -%}
  <title>{{ page_title }}</title>

  <meta name="author" content="{{ site.title }}">
  <meta name="description" content="{{ page.description | default: site.description | strip_html | strip_newlines | truncate: 180 }}">

  <link rel="icon" type="image/jpg" href="{{ '/assets/img/icon.jpg' | relative_url }}">
  <link rel="canonical" href="{{ page.url | absolute_url }}">

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&family=Roboto+Slab:wght@300;400;500;700&display=swap">

  <!-- Icons (Font Awesome + Academicons) -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.5.2/css/all.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/academicons@1.9.2/css/academicons.min.css">

  <!-- Styles -->
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">

  {%- feed_meta -%}

  {%- if site.google_analytics and site.google_analytics != "" -%}
    <script async src="https://www.googletagmanager.com/gtag/js?id={{ site.google_analytics }}"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', '{{ site.google_analytics }}');
    </script>
  {%- endif -%}
</head>
